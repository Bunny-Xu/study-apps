<!DOCTYPE html>
<!-- 本工作台为本地单文件 HTML，数据存浏览器 localStorage，核心功能零外链；仅「框选识别」文字识别需联网加载 OCR 模型（可离线仅裁剪为题图） -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>错题本 · 空白版</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --ink:#1f2330; --sub:#8a90a2;
    --line:#eceef3; --brand:#4c6ef5; --brand2:#7c5cff; --brand-soft:#eef1ff;
    --ok:#2f9e6b; --ok-soft:#e7f6ee; --warn:#e8833a; --warn-soft:#fdf0e6;
    --red:#e5484d; --red-soft:#fdeaea; --shadow:0 6px 24px rgba(31,35,48,.06);
    --radius:14px; --r:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));
    color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .brand h1{font-size:19px;font-weight:700;line-height:1.15}
  .brand p{font-size:12px;color:var(--sub)}
  .top-actions{display:flex;gap:7px;flex-wrap:wrap}
  button{cursor:pointer;border:none;font-family:inherit;font-size:14px;border-radius:var(--r);padding:9px 12px;transition:.15s}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:hover{background:#3b5bdb}
  .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
  .btn-soft{background:var(--brand-soft);color:var(--brand)}
  .btn-soft:hover{background:#e1e7ff}
  .iconbtn{display:inline-flex;align-items:center;gap:6px}
  .iconbtn svg{display:block}

  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:8px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-weight:600;font-size:13px}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
  .stat .n{font-size:25px;font-weight:800}
  .stat .l{font-size:12px;color:var(--sub)}
  .stat.ok .n{color:var(--ok)} .stat.warn .n{color:var(--warn)} .stat.due .n{color:var(--brand)}

  .panel{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .panel-hd h2{font-size:15px;display:flex;align-items:center;gap:7px}
  .panel-hd h2 svg{color:var(--brand)}
  .kp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
  .kp{border:1px solid var(--line);border-radius:12px;padding:12px}
  .kp-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
  .kp-name{font-weight:700;font-size:14px}
  .kp-tag{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .kp-tag.doing{background:var(--warn-soft);color:var(--warn)}
  .kp-tag.done{background:var(--ok-soft);color:var(--ok)}
  .bar{height:7px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#2f9e6b,#51cf85);border-radius:999px;transition:.4s}
  .kp-sub{font-size:11px;color:var(--sub);margin-top:6px}
  .seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:3px}
  .seg button{padding:5px 12px;font-size:12px;background:transparent;color:var(--sub);border-radius:999px}
  .seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow);font-weight:700}

  .toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);font-family:inherit;font-size:14px;color:var(--ink)}
  .toolbar input{flex:1;min-width:160px}
  .toolbar select{min-width:120px}
  .toolbar .spacer{flex:1}
  .duebtn{padding:9px 13px;border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:var(--r);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .duebtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}

  .group{margin-bottom:20px}
  .group-head{display:flex;align-items:center;gap:9px;margin-bottom:9px}
  .group-head .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);flex-shrink:0}
  .group-head h3{font-size:15px}
  .group-head .cnt{font-size:12px;color:var(--sub);background:var(--brand-soft);padding:2px 9px;border-radius:999px}
  .q{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
  .q-main{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;cursor:pointer}
  .q-check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;color:#fff}
  .q-check.on{background:var(--ok);border-color:var(--ok)}
  .q-body{flex:1;min-width:0}
  .q-content{font-weight:600;white-space:pre-wrap;word-break:break-word}
  .q-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bg);color:var(--sub)}
  .chip.kp{background:var(--brand-soft);color:var(--brand)}
  .chip.diff{background:#fff5e1;color:#b8860b}
  .q-actions{display:flex;gap:6px;flex-shrink:0}
  .mini{padding:6px 10px;font-size:12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub)}
  .mini:hover{border-color:var(--brand);color:var(--brand)}
  .mini.del:hover{border-color:var(--red);color:var(--red)}
  .q-detail{display:none;padding:0 15px 15px 48px;border-top:1px dashed var(--line);margin-top:2px}
  .q-detail.open{display:block;padding-top:12px}
  .q-detail .row{margin-bottom:9px}
  .q-detail .row .lab{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:3px}
  .q-detail .row .val{white-space:pre-wrap;word-break:break-word}
  .ans-wrong{color:var(--red)} .ans-right{color:var(--ok)}
  .empty{text-align:center;color:var(--sub);padding:46px 16px}
  .empty .big{font-size:15px;color:var(--ink);font-weight:700;margin-bottom:6px}

  .img-drop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
  .img-prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .ans-img-bar{margin:6px 0 2px}
  .ans-img-prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .thumb{position:relative;width:70px;height:70px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .thumb-x{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;font-size:12px;line-height:1;padding:0;cursor:pointer}
  .q-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .q-imgs img{max-width:150px;max-height:150px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}

  /* modal */
  .mask{position:fixed;inset:0;background:rgba(20,24,40,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:50}
  .modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.2);padding:20px;margin:auto}
  .modal h3{font-size:17px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .modal h3 svg{color:var(--brand)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .field textarea{resize:vertical;min-height:62px;line-height:1.5}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .req{color:var(--red)}
  .star-row{display:flex;gap:6px;align-items:center}
  .star-row .st{cursor:pointer}
  .modal-acts{display:flex;gap:9px;justify-content:flex-end;margin-top:8px}
  .modal-acts .btn{flex:0 0 auto}
  .modal-acts .grow{flex:1}

  .reminder{display:none;align-items:center;gap:10px;background:linear-gradient(135deg,#fff5e6,#ffe9d6);border:1px solid #ffd9b3;color:#9a5b1e;border-radius:12px;padding:11px 15px;margin-bottom:14px;cursor:pointer;font-weight:600}
  .reminder.show{display:flex}
  .reminder .go{margin-left:auto;background:#fff;color:#9a5b1e;border:1px solid #ffd9b3;border-radius:8px;padding:5px 12px;font-size:13px;font-weight:700}

  /* review */
  .rev-q{font-size:16px;font-weight:700;white-space:pre-wrap;word-break:break-word;line-height:1.6}
  .rev-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
  .rev-ans{display:none;background:var(--bg);border-radius:12px;padding:14px;margin-bottom:6px}
  .rev-ans.show{display:block}
  .rev-ans .lab{font-size:12px;color:var(--sub);font-weight:700;margin-bottom:3px}
  .rev-ans .v{white-space:pre-wrap;word-break:break-word}
  .rev-btns{display:none;gap:9px;margin-top:14px}
  .rev-btns.show{display:flex}
  .rev-btns button{flex:1;padding:11px;border-radius:10px;font-weight:700;font-size:14px}
  .rb-ok{background:var(--ok);color:#fff} .rb-no{background:var(--red);color:#fff}

  /* calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-grid .wd{text-align:center;font-size:12px;color:var(--sub);padding:4px 0}
  .cal-cell{aspect-ratio:1;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;position:relative;cursor:pointer;color:var(--ink)}
  .cal-cell.muted{color:var(--sub);opacity:.5}
  .cal-cell.today{outline:2px solid var(--brand);outline-offset:-2px}
  .cal-cell.due{background:var(--warn-soft);color:var(--warn);font-weight:700}
  .cal-cell.due::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
  .cal-cell.sel{background:var(--brand);color:#fff}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-nav .mt{font-weight:700;font-size:15px}
  .cal-nav button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:9px}

  /* students */
  .stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .stu-card{border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s}
  .stu-card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
  .stu-card .av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:8px}
  .stu-card .nm{font-weight:700}
  .stu-card .mt{font-size:12px;color:var(--sub);margin-top:3px}
  .stu-detail .back{margin-bottom:12px;display:inline-flex;align-items:center;gap:5px;color:var(--brand);font-size:13px;font-weight:700;cursor:pointer}
  .stu-detail .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .stu-detail .mini-stat{background:var(--bg);border-radius:12px;padding:12px;text-align:center}
  .stu-detail .mini-stat .n{font-size:22px;font-weight:800}
  .stu-detail .mini-stat .l{font-size:12px;color:var(--sub)}

  .weak-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .weak-row:last-child{border-bottom:none}
  .weak-row .nm{flex:1;font-weight:600}
  .weak-row .pct{font-weight:800;width:52px;text-align:right}
  .weak-row .wbar{flex:2;height:8px;background:var(--line);border-radius:999px;overflow:hidden;max-width:220px}
  .weak-row .wbar>i{display:block;height:100%;border-radius:999px}
  .weak-row.hot .pct{color:var(--red)} .weak-row.hot .wbar>i{background:var(--red)}
  .weak-row .wbar>i.ok{background:var(--ok)}

  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}

  /* 移动端 */
  @media (max-width:760px){
    body{padding:12px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .brand h1{font-size:17px}
    .top-actions{width:100%}
    .top-actions .iconbtn{flex:1;justify-content:center;font-size:13px;padding:9px 8px}
    .toolbar input{min-width:100%}
    .q-detail{padding-left:15px}
    .q-actions{flex-direction:column}
    .modal{padding:16px}
    .stu-detail .grid2{grid-template-columns:1fr}
    .kp-grid{grid-template-columns:1fr 1fr}
  }
  @media (max-width:420px){
    .kp-grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
  /* 打印 */
  @media print{
    body{background:#fff;padding:0}
    .top-actions,.toolbar,.tabs,.reminder,.stats,.panel,.q-actions,.q-check{display:none!important}
    .wrap{max-width:100%}
    .q{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  }

  /* 框选识别（卷子抠图 + OCR） */
  .crop-stage{position:relative;display:inline-block;max-width:100%;line-height:0;touch-action:none;-webkit-user-select:none;user-select:none}
  .crop-stage img{display:block;max-width:100%;max-height:60vh;border-radius:8px}
  .crop-sel{position:absolute;border:2px solid var(--brand);background:rgba(76,110,245,.14);box-sizing:border-box;cursor:move;display:none;box-shadow:0 0 0 9999px rgba(20,24,40,.28)}
  .crop-sel .ch{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--brand);border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .crop-sel .ch.nw{left:-9px;top:-9px;cursor:nwse-resize}
  .crop-sel .ch.ne{right:-9px;top:-9px;cursor:nesw-resize}
  .crop-sel .ch.sw{left:-9px;bottom:-9px;cursor:nesw-resize}
  .crop-sel .ch.se{right:-9px;bottom:-9px;cursor:nwse-resize}
  .crop-hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);color:#fff;font-size:12px;background:rgba(20,24,40,.55);padding:5px 12px;border-radius:999px;pointer-events:none;line-height:1.4;white-space:nowrap}
  .crop-empty{width:100%;min-height:180px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;text-align:center;padding:16px}

  /* 全屏看图（lightbox） */
  .lb-mask{position:fixed;inset:0;background:rgba(15,18,30,.92);display:flex;align-items:center;justify-content:center;z-index:200;padding:18px}
  .lb-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);-webkit-user-select:none;user-select:none;touch-action:none}
  .lb-x{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .lb-x:hover{background:rgba(255,255,255,.26)}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .lb-nav:hover{background:rgba(255,255,255,.26)}
  .lb-prev{left:14px} .lb-next{right:14px}
  .lb-count{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,.4);padding:4px 12px;border-radius:999px}
  @media (max-width:760px){ .lb-nav{width:38px;height:38px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" id="logoBox"></div>
      <div>
        <h1>错题本</h1>
        <p>知识点追踪 · 自动归类 · 本地保存</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn-soft iconbtn" data-act="review">DICE复习</button>
      <button class="btn-ghost iconbtn" data-act="students">USERS档案</button>
      <button class="btn-ghost iconbtn" data-act="calendar">CAL日历</button>
      <button class="btn-ghost iconbtn" data-act="weak">DOWN薄弱</button>
      <button class="btn-ghost iconbtn" data-act="print">PRINT打印</button>
      <button class="btn-ghost iconbtn" data-act="load">BOOK载入示例</button>
      <button class="btn-ghost iconbtn" data-act="import">DL导入</button>
      <button class="btn-ghost iconbtn" data-act="export">UL导出</button>
      <button class="btn-primary iconbtn" data-act="add">PLUS添加错题</button>
    </div>
  </header>

  <div class="reminder" id="reminder" data-act="review">
    <span id="reminderTxt"></span>
    <span class="go">去复习</span>
  </div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="panel-hd">
      <h2>KNOW知识点掌握度</h2>
      <div class="seg" id="trendSeg">
        <button type="button" data-act="trend7" class="on">近 7 天</button>
        <button type="button" data-act="trend30">近 30 天</button>
      </div>
    </div>
    <div class="kp-grid" id="kpGrid"></div>
    <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      <div class="pj-sub" style="font-size:12px;color:var(--sub);margin-bottom:8px">掌握率趋势</div>
      <div id="trendBox"></div>
    </div>
  </div>

  <div class="toolbar">
    <input id="search" type="text" placeholder="搜索题目 / 知识点 / 错因…" inputmode="search" />
  </div>
  <div class="tabs" id="subjectTabs"></div>
  <div class="tabs" id="gradeTabs" style="margin-top:-6px"></div>
  <div class="toolbar">
    <select id="filterKp"><option value="">全部知识点</option></select>
    <select id="filterStatus">
      <option value="">全部状态</option>
      <option value="done">已掌握</option>
      <option value="todo">待掌握</option>
    </select>
    <span class="spacer"></span>
    <button class="duebtn" id="todayBtn" data-act="today">今日新增</button>
    <button class="duebtn" id="dueBtn" data-act="due">仅看待复习</button>
  </div>

  <div id="list"></div>
</div>

<div id="modalHost"></div>
<div id="lightboxHost"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ 图标（内联 SVG，零 emoji） ============ */
function icon(name, size, color){
  size = size||18; color = color||"currentColor";
  var P = {
    book:'<path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5Z"/><path d="M18 3H8a2 2 0 0 0-2 2"/>',
    calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15v4M8 19h4"/>',
    abc:'<path d="M3 7v5a3 3 0 0 0 6 0V7M3 9h6M17 7l-3 9M14 12h6"/>',
    dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.3"/><circle cx="15" cy="15" r="1.3"/><circle cx="15" cy="9" r="1.3"/><circle cx="9" cy="15" r="1.3"/>',

/* ============ 数据层 ============ */
var KEY = 'workbuddy_cuotiben_v1';
var TREND_KEY = 'workbuddy_cuotiben_trend_v1';
var SUBJECTS = ['语文','数学','英语'];
var GRADES = ['小学五年级'];

var data = [];
var trend = [];
var state = { curSub:'全部', gradeFilter:'', kw:'', fKp:'', fStatus:'', dueOnly:false, todayOnly:false, trendRange:7,
  editingId:null, pendingImages:[], ansImgs:{wrong:[],right:[],reason:[]}, _ansSlot:null, reviewId:null, calDate:null, calSel:null, modal:'none', _lb:null };

function load(){
  try{
    var r = localStorage.getItem(KEY);
    var arr = r ? JSON.parse(r) : [];
    if(!Array.isArray(arr)) arr = [];
    return arr.map(function(q){
      if(!Array.isArray(q.images)) q.images = [];
      if(q.grade == null) q.grade = '';
      if(q.student == null) q.student = '';
      if(q.nextReview == null) q.nextReview = (q.createdAt||Date.now()) + 864e5;
      if(q.reviewStage == null) q.reviewStage = 0;
      if(!q.difficulty) q.difficulty = 3;
      if(q.mastered == null) q.mastered = false;
      return q;
    });
  }catch(e){ return []; }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} recordSnapshot(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function recordSnapshot(){
  var all = data;
  var total = all.length, done = all.filter(function(q){return q.mastered;}).length;
  var rate = total ? Math.round(done/total*100) : 0;
  var today = fmtDate(Date.now());
  trend = trend.filter(function(t){ return t.date !== today; });
  trend.push({ date:today, rate:rate, total:total, done:done });
  if(trend.length > 120) trend = trend.slice(-120);
  try{ localStorage.setItem(TREND_KEY, JSON.stringify(trend)); }catch(e){}
}
function loadTrend(){ try{ var r = localStorage.getItem(TREND_KEY); trend = r?JSON.parse(r):[]; if(!Array.isArray(trend)) trend=[]; }catch(e){ trend=[]; } }

/* ============ 计算层 ============ */
var SR = [1,2,4,7,15,30];
function nextReviewTs(stage){ var d = SR[Math.min(stage, SR.length-1)]; return Date.now() + d*864e5; }
function isDue(q){ return q.nextReview != null && q.nextReview <= Date.now(); }
function fmtDate(ts){ var d = new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isToday(ts){ if(ts==null) return false; return fmtDate(ts)===fmtDate(Date.now()); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function scopeOf(){ return data.filter(function(q){ return (state.curSub==='全部'||q.subject===state.curSub) && (!state.gradeFilter||(q.grade||'')===state.gradeFilter); }); }
function subjectsOf(){ return scopeOf(); }
function dueCount(){ return scopeOf().filter(isDue).length; }

/* ============ 渲染层 ============ */
function renderStats(){
  var all = scopeOf(), total = all.length;
  var done = all.filter(function(q){return q.mastered;}).length;
  var todo = total - done, due = all.filter(isDue).length;
  var todayNew = all.filter(function(q){ return isToday(q.createdAt); }).length;
  document.getElementById('stats').innerHTML =
    '<div class="stat"><div class="n">'+total+'</div><div class="l">错题总数</div></div>'+
    '<div class="stat ok"><div class="n">'+done+'</div><div class="l">已掌握</div></div>'+
    '<div class="stat warn"><div class="n">'+todo+'</div><div class="l">待掌握</div></div>'+
    '<div class="stat due"><div class="n">'+due+'</div><div class="l">今日待复习</div></div>';
  // 提醒条
  var rm = document.getElementById('reminder');
  if(due>0){ rm.classList.add('show'); document.getElementById('reminderTxt').textContent = '今天有 '+due+' 道错题待复习'; }
  else if(todayNew>0){ rm.classList.add('show'); document.getElementById('reminderTxt').textContent = '今天新增了 '+todayNew+' 道错题，点「今日新增」可立即检视复习'; }
  else { rm.classList.remove('show'); }
}
function renderKp(){
  var sub = subjectsOf();
  var map = {};
  sub.forEach(function(q){ var k = q.knowledge || '未分类'; if(!map[k]) map[k] = {total:0,done:0}; map[k].total++; if(q.mastered) map[k].done++; });
  var keys = Object.keys(map);
  var grid = document.getElementById('kpGrid');
  if(!keys.length){ grid.innerHTML = '<div class="empty" style="grid-column:1/-1">还没有知识点，先添加一道错题吧</div>'; return; }
  grid.innerHTML = keys.sort(function(a,b){ return a.localeCompare(b,'zh'); }).map(function(k){
    var m = map[k], pct = Math.round(m.done/m.total*100), allDone = m.done===m.total;
    return '<div class="kp"><div class="kp-top"><span class="kp-name">'+esc(k)+'</span>'+
      '<span class="kp-tag '+(allDone?'done':'doing')+'">'+(allDone?'已掌握':'待掌握')+'</span></div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
      '<div class="kp-sub">'+m.done+'/'+m.total+' 题已掌握 · '+pct+'%</div></div>';
  }).join('');
}
function renderTrend(){
  var box = document.getElementById('trendBox');
  var days = state.trendRange;
  var cutoff = Date.now() - (days-1)*864e5;
  var pts = trend.filter(function(t){ return new Date(t.date).getTime() >= cutoff; });
  if(pts.length < 2){
    box.innerHTML = '<div class="empty" style="padding:18px 0">数据积累中，继续录入或复习后会自动生成趋势图</div>';
    return;
  }
  var W=640, H=160, pad=24;
  var vals = pts.map(function(p){ return p.rate; });
  var maxV = 100, minV = 0;
  var n = pts.length;
  var xs = function(i){ return pad + i*(W-2*pad)/(n-1); };
  var ys = function(v){ return H-pad - (v-minV)/(maxV-minV)*(H-2*pad); };
  var line = pts.map(function(p,i){ return (i?'L':'M')+xs(i).toFixed(1)+' '+ys(p.rate).toFixed(1); }).join(' ');
  var area = 'M'+xs(0).toFixed(1)+' '+(H-pad)+' ' + pts.map(function(p,i){ return 'L'+xs(i).toFixed(1)+' '+ys(p.rate).toFixed(1); }).join(' ') + ' L'+xs(n-1).toFixed(1)+' '+(H-pad)+' Z';
  var dots = pts.map(function(p,i){ return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(p.rate).toFixed(1)+'" r="3" fill="var(--brand)"/>'; }).join('');
  var labels = pts.map(function(p,i){ return '<text x="'+xs(i).toFixed(1)+'" y="'+(H-6)+'" font-size="9" fill="#8a90a2" text-anchor="middle">'+p.date.slice(5)+'</text>'; }).join('');
  box.innerHTML = '<svg width="100%" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="display:block">'+
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4c6ef5" stop-opacity=".18"/><stop offset="1" stop-color="#4c6ef5" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+area+'" fill="url(#tg)"/>'+
    '<path d="'+line+'" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round"/>'+
    dots + labels + '</svg>';
}
function renderSubjects(){
  var tabs = ['<div class="tab'+(state.curSub==='全部'?' active':'')+'" data-act="sub" data-sub="全部">全部</div>']
    .concat(SUBJECTS.map(function(s){ return '<div class="tab'+(state.curSub===s?' active':'')+'" data-act="sub" data-sub="'+s+'">'+s+'</div>'; }));
  document.getElementById('subjectTabs').innerHTML = tabs.join('');
}
function renderGrades(){
  var set = ['全部年级'].concat(GRADES).concat([...new Set(data.map(function(q){return q.grade;}).filter(Boolean))].filter(function(g){ return GRADES.indexOf(g)<0; }) );
  var wrap = document.getElementById('gradeTabs');
  wrap.innerHTML = set.map(function(g){
    var v = g==='全部年级' ? '' : g;
    return '<div class="tab'+( (state.gradeFilter===(g==='全部年级'?'':g))?' active':'')+'" data-act="grade" data-g="'+esc(v)+'">'+esc(g)+'</div>';
  }).join('');
}
function renderFilterKp(){
  var sel = document.getElementById('filterKp'), cur = sel.value;
  var set = [...new Set(subjectsOf().map(function(q){ return q.knowledge||'未分类'; }))].sort(function(a,b){return a.localeCompare(b,'zh');});
  sel.innerHTML = '<option value="">全部知识点</option>' + set.map(function(k){ return '<option value="'+esc(k)+'">'+esc(k)+'</option>'; }).join('');
  if(set.indexOf(cur)>=0) sel.value = cur;
}
function renderList(){
  var sub = subjectsOf();
  var kw = state.kw.trim().toLowerCase();
  var fkp = document.getElementById('filterKp').value;
  var fst = document.getElementById('filterStatus').value;
  var list = sub.filter(function(q){
    if(fkp && (q.knowledge||'未分类') !== fkp) return false;
    if(fst==='done' && !q.mastered) return false;
    if(fst==='todo' && q.mastered) return false;
    if(state.dueOnly && !isDue(q)) return false;
    if(state.todayOnly && !isToday(q.createdAt)) return false;
    if(state.gradeFilter && (q.grade||'') !== state.gradeFilter) return false;
    if(state.calSel != null && !(q.nextReview >= state.calSel && q.nextReview < state.calSel + 864e5)) return false;
    if(kw){
      var hay = (q.content+q.knowledge+q.reason+(q.wrong||'')+(q.right||'')+(q.student||'')).toLowerCase();
      if(hay.indexOf(kw)<0) return false;
    }
    return true;
  });
  var listEl = document.getElementById('list');
  if(!list.length){
    listEl.innerHTML = '<div class="empty"><div class="big">还没有错题</div>点右上角「添加错题」，把今天的错题记下来吧。<br>支持粘贴题目截图，自动按知识点归类。</div>';
    return;
  }
  var groups = {};
  list.forEach(function(q){ var k = q.knowledge||'未分类'; (groups[k]=groups[k]||[]).push(q); });
  listEl.innerHTML = Object.keys(groups).sort(function(a,b){return a.localeCompare(b,'zh');}).map(function(k){
    var qs = groups[k];
    return '<div class="group"><div class="group-head"><span class="dot"></span><h3>'+esc(k)+'</h3><span class="cnt">'+qs.length+' 题</span></div>'+qs.map(qHtml).join('')+'</div>';
  }).join('');
}

  for(var i=1;i<=5;i++){ s += '<span class="st" data-act="setstar" data-n="'+i+'">'+icon('star',16, i<=n?'#f5b50a':'#d9dde6')+'</span>'; }

      '<div class="row"><div class="lab">正确答案</div><div class="val ans-right">'+esc(q.right||'（未填写）')+'</div></div>'+ansImgsHtml(q.rightImages)+

function cropOnFile(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    var img = document.getElementById('cropImg');
    img.onload = function(){ requestAnimationFrame(cropImgReady); };
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
  e.target.value = '';
}
function cropImgReady(){
  document.getElementById('cropEmpty').style.display = 'none';
  document.getElementById('cropWrap').style.display = 'block';
  var img = document.getElementById('cropImg');
  var w = img.clientWidth, h = img.clientHeight;
  if(!w || !h){ w = img.naturalWidth; h = img.naturalHeight; }
  cropSel = { x:0, y:0, w:w, h:h };
  drawSel();
  var b = document.getElementById('cropRecBtn'); b.disabled = false; b.style.opacity = '1';
}
function drawSel(){
  if(!cropSel) return;
  var el = document.getElementById('cropSel');
  el.style.display = 'block';
  el.style.left = cropSel.x + 'px'; el.style.top = cropSel.y + 'px';
  el.style.width = cropSel.w + 'px'; el.style.height = cropSel.h + 'px';
}
function cropDown(e){
  if(!cropSel) return;
  var r = document.getElementById('cropImg').getBoundingClientRect();
  var px = e.clientX - r.left, py = e.clientY - r.top;
  var h = e.target.getAttribute && e.target.getAttribute('data-h');
  if(h){ cropDrag = 'resize:' + h; }
  else if(e.target.id === 'cropSel' || (e.target.parentNode && e.target.parentNode.id === 'cropSel')){ cropDrag = 'move'; }
  else { cropDrag = 'new'; cropSel = { x:px, y:py, w:0, h:0 }; }
  cropStart = { x:px, y:py, sel:{ x:cropSel.x, y:cropSel.y, w:cropSel.w, h:cropSel.h } };
  try{ document.getElementById('cropStage').setPointerCapture(e.pointerId); }catch(_){}
  e.preventDefault();
}
function cropMove(e){
  if(!cropDrag || !cropSel) return;
  var r = document.getElementById('cropImg').getBoundingClientRect();
  var px = Math.max(0, Math.min(r.width, e.clientX - r.left));
  var py = Math.max(0, Math.min(r.height, e.clientY - r.top));
  var s = cropSel;
  if(cropDrag === 'new'){
    s.x = Math.min(cropStart.x, px); s.y = Math.min(cropStart.y, py);
    s.w = Math.abs(px - cropStart.x); s.h = Math.abs(py - cropStart.y);
  } else if(cropDrag === 'move'){
    var dx = px - cropStart.x, dy = py - cropStart.y;
    s.x = Math.max(0, Math.min(r.width - cropStart.sel.w, cropStart.sel.x + dx));
    s.y = Math.max(0, Math.min(r.height - cropStart.sel.h, cropStart.sel.y + dy));
    s.w = cropStart.sel.w; s.h = cropStart.sel.h;
  } else if(cropDrag.indexOf('resize') === 0){
    var corner = cropDrag.split(':')[1];
    var x0 = cropStart.sel.x, y0 = cropStart.sel.y, x1 = cropStart.sel.x + cropStart.sel.w, y1 = cropStart.sel.y + cropStart.sel.h;
    if(corner.indexOf('w') >= 0) x0 = px; if(corner.indexOf('e') >= 0) x1 = px;
    if(corner.indexOf('n') >= 0) y0 = py; if(corner.indexOf('s') >= 0) y1 = py;
    s.x = Math.min(x0, x1); s.y = Math.min(y0, y1); s.w = Math.abs(x1 - x0); s.h = Math.abs(y1 - y0);
  }
  drawSel();
  var hint = document.getElementById('cropHint'); if(hint) hint.style.display = 'none';
}
function cropUp(e){
  cropDrag = null;
  try{ document.getElementById('cropStage').releasePointerCapture(e.pointerId); }catch(_){}
}
function cropToCanvas(){
  var img = document.getElementById('cropImg');
  var sx = cropSel.x * (img.naturalWidth / img.clientWidth);
  var sy = cropSel.y * (img.naturalHeight / img.clientHeight);
  var sw = cropSel.w * (img.naturalWidth / img.clientWidth);
  var sh = cropSel.h * (img.naturalHeight / img.clientHeight);
  var cv = document.createElement('canvas');
  cv.width = Math.max(1, Math.round(sw)); cv.height = Math.max(1, Math.round(sh));
  cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
  return cv;
}
function cropToDataURL(cv){
  var max = 1400;
  if(cv.width <= max && cv.height <= max) return cv.toDataURL('image/jpeg', 0.85);
  var r = Math.min(max / cv.width, max / cv.height);
  var c2 = document.createElement('canvas'); c2.width = Math.round(cv.width * r); c2.height = Math.round(cv.height * r);
  c2.getContext('2d').drawImage(cv, 0, 0, c2.width, c2.height);
  return c2.toDataURL('image/jpeg', 0.85);
}
function cropAsImg(){
  if(!cropSel) return;
  var cv = cropToCanvas(); var url = cropToDataURL(cv);
  state._cardDraft = state._cardDraft || {};
  state._cardDraft.images = state._cardDraft.images || [];
  if(state._cardDraft.images.length < 9) state._cardDraft.images.push(url);
  toast('已裁剪为题图');
  restoreCard();
}
function cropFill(){
  var txt = (document.getElementById('cropOcr').value || '').trim();
  if(!txt){ toast('还没有识别文字，先点「识别题目文字」'); return; }
  var d = state._cardDraft || {};
  var existing = (d.content || '').trim();
  d.content = existing ? (existing + '\n\n' + txt) : txt;
  restoreCard();
  toast('已填入题目，可继续编辑');
}
function cleanOcr(t){
  return t.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').replace(/[ \t]{2,}/g, ' ').replace(/[ \t]+$/gm, '').trim();
}
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  return new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = function(){ res(window.Tesseract); };
    s.onerror = function(){ rej(new Error('OCR 引擎加载失败（需要联网）')); };
    document.head.appendChild(s);
  });
}
function cropRecognize(){
  if(!cropSel || !cropSel.w || !cropSel.h) return;
  var btn = document.getElementById('cropRecBtn'); btn.disabled = true;
  var status = document.getElementById('cropStatus');
  status.textContent = '正在准备识别引擎…';
  loadTesseract().then(function(T){
    status.textContent = '正在加载 / 下载中文识别模型…（首次较慢）';
    return T.createWorker(['chi_sim', 'eng'], 1, { logger: function(m){
      if(m && m.status === 'recognizing text' && status) status.textContent = '识别中… ' + Math.round((m.progress || 0) * 100) + '%';
    }});
  }).then(function(worker){
    var cv = cropToCanvas();
    return worker.recognize(cv).then(function(res){
      return worker.terminate().then(function(){ return res; });
    });
  }).then(function(res){
    var txt = cleanOcr((res && res.data ? res.data.text : (res && res.text) || '').trim());
    document.getElementById('cropOcr').value = txt;
    status.textContent = '识别完成，可在上方修改后「填入并返回」';
    var fb = document.getElementById('cropFillBtn'); fb.disabled = false; fb.style.opacity = '1';
  }).catch(function(err){
    status.textContent = '识别失败：' + (err && err.message ? err.message : err) + '（可改用「仅裁剪为题图」）';
  }).then(function(){
    btn.disabled = false;
  });
}

/* ============ 动作处理 ============ */
function handleAct(act, el){
  if(act==='mask' || act==='close'){ closeModal(); return; }
  if(act==='review'){ openReview(); return; }
  if(act==='students'){ openStudents(); return; }
  if(act==='studetail'){ openStudentDetail(el.getAttribute('data-n')); return; }
  if(act==='calendar'){ openCalendar(); return; }
  if(act==='calprev'){ state.calDate.setMonth(state.calDate.getMonth()-1); openCalendar(); return; }
  if(act==='calnext'){ state.calDate.setMonth(state.calDate.getMonth()+1); openCalendar(); return; }
  if(act==='calday'){ state.calSel = parseInt(el.getAttribute('data-ts'),10); closeModal(); refreshAll(); toast('已筛选该日待复习题'); return; }
  if(act==='calclear'){ state.calSel = null; closeModal(); refreshAll(); return; }
  if(act==='weak'){ openWeak(); return; }
  if(act==='weakcsv'){ exportWeakCsv(); return; }
  if(act==='print'){ openPrint(); return; }
  if(act==='printgo'){ doPrint(); return; }
  if(act==='load'){ loadDemo(); return; }
  if(act==='import'){ importFile(); return; }
  if(act==='export'){ exportJson(); return; }
  if(act==='add'){ askCard(null); return; }
  if(act==='savecard'){ saveCard(); return; }
  if(act==='imgpick'){ document.getElementById('cImg').click(); return; }
  if(act==='cropOpen'){ openCrop(); return; }
  if(act==='cropCamera'){ document.getElementById('cropFileCam').click(); return; }
  if(act==='cropPick'){ document.getElementById('cropFile').click(); return; }
  if(act==='cropRecognize'){ cropRecognize(); return; }
  if(act==='cropAsImg'){ cropAsImg(); return; }
  if(act==='cropFill'){ cropFill(); return; }
  if(act==='cropCancel'){ restoreCard(); return; }
  if(act==='imgdel'){ state.pendingImages.splice(parseInt(el.getAttribute('data-i'),10),1); renderImgPrev(); return; }
  if(act==='ansimgpick'){ state._ansSlot = el.getAttribute('data-slot'); document.getElementById('ansImgInput').click(); return; }
  if(act==='ansimgdel'){ var as=el.getAttribute('data-slot'), ai=parseInt(el.getAttribute('data-i'),10); if(state.ansImgs[as]){ state.ansImgs[as].splice(ai,1); renderAnsImgPrev(as); } return; }
  if(act==='setstar'){ state._star = parseInt(el.getAttribute('data-n'),10); document.getElementById('starRow').innerHTML = starRow(state._star); return; }
  if(act==='trend7'){ state.trendRange=7; setTrendSeg(); renderTrend(); return; }
  if(act==='trend30'){ state.trendRange=30; setTrendSeg(); renderTrend(); return; }
  if(act==='due'){ state.dueOnly=!state.dueOnly; el.classList.toggle('on'); if(state.dueOnly){ state.todayOnly=false; var tb=document.getElementById('todayBtn'); if(tb) tb.classList.remove('on'); } refreshAll(); return; }
  if(act==='today'){ state.todayOnly=!state.todayOnly; el.classList.toggle('on'); if(state.todayOnly){ state.dueOnly=false; var db=document.getElementById('dueBtn'); if(db) db.classList.remove('on'); } refreshAll(); return; }
  if(act==='imgview'){ openLightbox(el); return; }
  if(act==='lbprev'){ if(state._lb){ state._lb.idx=(state._lb.idx-1+state._lb.srcs.length)%state._lb.srcs.length; renderLightbox(); } return; }
  if(act==='lbnext'){ if(state._lb){ state._lb.idx=(state._lb.idx+1)%state._lb.srcs.length; renderLightbox(); } return; }
  if(act==='sub'){ state.curSub = el.getAttribute('data-sub'); refreshAll(); return; }
  if(act==='grade'){ state.gradeFilter = el.getAttribute('data-g')||''; refreshAll(); return; }
  if(act==='check'){ toggleMastered(el.closest('.q').getAttribute('data-id')); return; }
  if(act==='toggle'){ var id=el.closest('.q').getAttribute('data-id'); var box=document.getElementById('d-'+id); if(box) box.classList.toggle('open'); return; }
  if(act==='edit'){ askCard(el.closest('.q').getAttribute('data-id')); return; }
  if(act==='del'){ delCard(el.closest('.q').getAttribute('data-id')); return; }
  if(act==='revshow'){ document.getElementById('revAns').classList.add('show'); document.getElementById('revShow').style.display='none'; document.getElementById('revBtns').classList.add('show'); return; }
  if(act==='revok'){ reviewResult(true); return; }
  if(act==='revno'){ reviewResult(false); return; }
  if(act==='revnext'){ closeModal(); openReview(); return; }
}
function setTrendSeg(){
  document.querySelectorAll('#trendSeg button').forEach(function(b){
    b.classList.toggle('on', (b.getAttribute('data-act')==='trend7'&&state.trendRange===7)||(b.getAttribute('data-act')==='trend30'&&state.trendRange===30));
  });
}
function toggleMastered(id){
  var q = data.find(function(x){return x.id===id;}); if(!q) return;
  q.mastered = !q.mastered;
  if(q.mastered){ q.reviewStage = 5; q.nextReview = Date.now() + 999*864e5; }
  else { q.reviewStage = 0; q.nextReview = Date.now(); }
  save(); refreshAll();
  toast(q.mastered?'已标记掌握':'已移回待掌握');
}
function reviewResult(ok){
  var q = data.find(function(x){return x.id===state.reviewId;}); if(!q) return;
  if(ok){ q.reviewStage = Math.min(q.reviewStage+1, SR.length-1); q.mastered = q.reviewStage>=4; }
  else { q.reviewStage = 0; q.mastered = false; }
  q.nextReview = nextReviewTs(q.reviewStage);
  save(); closeModal(); refreshAll();
  toast(ok?'答对了，复习周期已拉长':'记下来，下次早点复习');
}
function saveCard(){
  var content = document.getElementById('cContent').value.trim();
  var kp = document.getElementById('cKp').value.trim();
  if(!kp){ toast('知识点为必填'); return; }
  if(!content && state.pendingImages.length===0){ toast('请填写题目文字，或用「拍照/上传卷子框选」框出一张题目图片'); return; }
  var obj = {
    subject: document.getElementById('cSub').value,
    grade: document.getElementById('cGrade').value,
    content: content, wrong: document.getElementById('cWrong').value.trim(),
    right: document.getElementById('cRight').value.trim(), reason: document.getElementById('cReason').value.trim(),
    knowledge: kp, student: document.getElementById('cStu').value.trim(),
    difficulty: state._star||3, images: state.pendingImages.slice(),
    wrongImages: state.ansImgs.wrong.slice(), rightImages: state.ansImgs.right.slice(), reasonImages: state.ansImgs.reason.slice()
  };
  if(state.editingId){
    var q = data.find(function(x){return x.id===state.editingId;});
    Object.assign(q, obj);
  } else {
    obj.id = uid(); obj.createdAt = Date.now(); obj.mastered=false; obj.reviewStage=0; obj.nextReview = Date.now()+864e5;
    data.push(obj);
  }
  save(); closeModal(); refreshAll();
  toast(state.editingId?'已保存':'已添加错题');
}
function delCard(id){
  var q = data.find(function(x){return x.id===id;}); if(!q) return;
  openModal('<div class="modal"><h3>删除确认</h3>'+
    '<div style="color:var(--sub);margin-bottom:14px">确定删除这道错题吗？此操作不可撤销。<br><b>'+esc((q.content||'图片题').slice(0,40))+'</b></div>'+
    '<div class="modal-acts"><button class="btn btn-ghost" data-act="close">取消</button>'+
    '<button class="btn btn-primary" data-act="dodel" style="background:var(--red)">删除</button></div></div>');
  state._delId = id;
}
function doDel(){
  data = data.filter(function(x){return x.id!==state._delId;});
  save(); closeModal(); refreshAll(); toast('已删除');
}

/* 图片压缩 */
function compressImg(file, cb){
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      var w = img.width, h = img.height, max = 800;
      if(w>max || h>max){ var r = Math.min(max/w, max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.82));
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function onImgPick(e){
  var files = e.target.files; if(!files.length) return;
  var n = files.length, done = 0;
  Array.prototype.forEach.call(files, function(f){
    compressImg(f, function(b64){
      if(state.pendingImages.length < 9) state.pendingImages.push(b64);
      done++; if(done===n) renderImgPrev();
    });
  });
  e.target.value = '';
}
function renderImgPrev(){
  var box = document.getElementById('imgPrev'); if(!box) return;
  box.innerHTML = state.pendingImages.map(function(s,i){ return '<div class="thumb"><img src="'+s+'"><button class="thumb-x" data-act="imgdel" data-i="'+i+'">×</button></div>'; }).join('');
}
function onAnsImgPick(e){
  var slot = state._ansSlot; if(!slot) return;
  var files = e.target.files; if(!files.length) return;
  var n = files.length, done = 0;
  Array.prototype.forEach.call(files, function(f){
    compressImg(f, function(b64){
      if(state.ansImgs[slot].length < 9) state.ansImgs[slot].push(b64);
      done++; if(done===n) renderAnsImgPrev(slot);
    });
  });
  e.target.value = '';
}
function renderAnsImgPrev(slot){
  var box = document.getElementById('ansPrev_'+slot); if(!box) return;
  box.innerHTML = state.ansImgs[slot].map(function(s,i){ return '<div class="thumb"><img src="'+s+'"><button class="thumb-x" data-act="ansimgdel" data-slot="'+slot+'" data-i="'+i+'">×</button></div>'; }).join('');
}

/* 全屏看图（lightbox） */
function openLightbox(imgEl){
  var wrap = imgEl.closest('.q-imgs') || imgEl.parentElement;
  var imgs = wrap ? Array.prototype.slice.call(wrap.querySelectorAll('img')) : [imgEl];
  var srcs = imgs.map(function(im){ return im.getAttribute('src') || im.src; });
  var idx = Math.max(0, imgs.indexOf(imgEl));
  state._lb = { srcs: srcs, idx: idx };
  renderLightbox();
}
function renderLightbox(){
  var lb = state._lb; if(!lb) return;
  var host = document.getElementById('lightboxHost');
  if(!host) return;
  var src = lb.srcs[lb.idx];
  var multi = lb.srcs.length > 1;
  host.innerHTML = '<div class="lb-mask" id="lbMask" data-act="lbclose">'+
    (multi?'<button class="lb-nav lb-prev" data-act="lbprev" type="button">'+icon('chevL',20,'#fff')+'</button>':'')+
    (multi?'<button class="lb-nav lb-next" data-act="lbnext" type="button">'+icon('chevR',20,'#fff')+'</button>':'')+
    '<img class="lb-img" id="lbImg" src="'+src+'" alt="全屏看图">'+
    '<button class="lb-x" data-act="lbclose" type="button">'+icon('x',20,'#fff')+'</button>'+
    (multi?'<div class="lb-count">'+(lb.idx+1)+' / '+lb.srcs.length+'</div>':'')+
    '</div>';
}
function lbClose(){ state._lb = null; var host = document.getElementById('lightboxHost'); if(host) host.innerHTML=''; }

/* 数据导入导出 */
function download(name, content, type){
  var blob = new Blob([content], {type:type||'text/plain'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}
function exportJson(){
  download('错题本_'+fmtDate(Date.now())+'.json', JSON.stringify({data:data, trend:trend}, null, 2), 'application/json');
  toast('已导出 JSON');
}
function importFile(){
  var inp = document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var o = JSON.parse(rd.result);
        if(o && Array.isArray(o.data)){ data = o.data; trend = Array.isArray(o.trend)?o.trend:[]; save(); refreshAll(); toast('已导入 '+data.length+' 条'); }
        else if(Array.isArray(o)){ data = o; save(); refreshAll(); toast('已导入 '+data.length+' 条'); }
        else toast('文件格式不正确');
      }catch(e){ toast('解析失败：'+e.message); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function csvEscape(s){ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function exportWeakCsv(){
  var sub = subjectsOf(); var map={};
  sub.forEach(function(q){ var k=q.knowledge||'未分类'; if(!map[k]) map[k]={t:0,d:0}; map[k].t++; if(q.mastered) map[k].d++; });
  var lines = ['知识点,总题数,已掌握,掌握率'];
  Object.keys(map).forEach(function(k){ var m=map[k]; lines.push([k,m.t,m.d,Math.round(m.d/m.t*100)+'%'].map(csvEscape).join(',')); });
  download('薄弱知识点_'+fmtDate(Date.now())+'.csv', '﻿'+lines.join('\n'), 'text/csv');
  toast('已导出 CSV');
}

  openModal('<div class="modal"><h3>载入示例</h3>'+

}

/* toast */
var toastTimer;
function toast(msg){
  var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ============ 初始化 ============ */
function init(){
  data = load(); loadTrend();
  paintTopBtns();
  // 静态筛选绑定
  document.getElementById('search').addEventListener('input', function(e){ state.kw = e.target.value; renderList(); });
  document.getElementById('filterKp').addEventListener('change', function(){ state.fKp = this.value; renderList(); });
  document.getElementById('filterStatus').addEventListener('change', function(){ state.fStatus = this.value; renderList(); });
  // 全局事件委托
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]'); if(!el) return;
    var act = el.getAttribute('data-act');
    if(act==='mask'){ if(e.target === el) closeModal(); return; } // 只有直接点遮罩背景本身才关，点弹窗内部（含空白）不关
    if(act==='cropMask'){ if(e.target === el) restoreCard(); return; } // 框选弹窗点背景 = 取消并返回卡片
    if(act==='lbclose'){ if(e.target.id==='lbImg') return; lbClose(); return; } // 点背景 / 关闭按钮关图，点图片本身不关
    if(act==='dodel'){ doDel(); return; }
    if(act==='doload'){ doLoadDemo(); return; }
    handleAct(act, el);
  });
  // 粘贴截图到卡片弹窗
  document.addEventListener('paste', function(e){
    if(state.modal!=='card') return;
    var items = e.clipboardData && e.clipboardData.items; if(!items) return;
    var imgs = [];
    Array.prototype.forEach.call(items, function(it){ if(it.type.indexOf('image')===0) imgs.push(it.getAsFile()); });
    if(!imgs.length) return;
    imgs.forEach(function(f){ compressImg(f, function(b64){ if(state.pendingImages.length<9){ state.pendingImages.push(b64); renderImgPrev(); } }); });
  });
  refreshAll();
}
window.addEventListener('DOMContentLoaded', init);
